name: release

# Push a tag like v3.0.0 to build the Windows .exe and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: pyinstaller --noconfirm manontheline.spec
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/manontheline.exe
          generate_release_notes: true
